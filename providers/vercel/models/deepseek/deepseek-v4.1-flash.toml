# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = high|xhigh (Vercel gateway aliases)
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 0.9
output = 0.9
cache_read = 0.45

[limit]
context = 1_048_576
output = 1_048_576
